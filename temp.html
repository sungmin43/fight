<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Animation</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* 1. 나눔라운드 폰트 로드 */
    @import url('https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css');

    :root {
      --base: #5E5690;
      --base-light: #7873A7;
      --base-dark: #555184;
      --shadow: #4F4C6B;
      --letter: #d8d7e5;
    }

    *, *::before, *::after {
      border: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f4f4f9;
      overflow: hidden;
      /* 기본 폰트 설정 */
      font-family: 'NanumSquareRound', sans-serif;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      position: relative;
      perspective: 600px;
    }

    .shadow {
      position: absolute;
      width: 200px;
      height: 1px;
      background: transparent;
      border-radius: 30%;
      box-shadow: 50px 100px 10px 5px #eeeef3;
    }

    .letter {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 280px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      border-radius: 2px;
      background: var(--letter);
      box-shadow: 0px 1px 7px -2px var(--base);
    }

    .letter .body {
      position: relative;
      width: 240px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--base);
    }
    
    .letter .body .close {
      position: absolute;
      right: 0;
      top: 0;
      font-size: 30px;
      cursor: pointer;
      user-select: none;
    } 
    
    .letter .body .message {
      font-size: 38px; /* 폰트 크기 살짝 조정 */
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
    }

    .envelope {
      position: relative;
      width: 300px; 
      height: 180px; 
      background: linear-gradient(#cccbd7 0.5px, var(--base-light) 0.5px);
      cursor: pointer;
      --flap-rotate: 0deg;
      --flap-z: 30;
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 300px;  
      border-top: 115px solid #7873A7;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      box-sizing: border-box;
      transform-origin: top;
      transform: rotateX(var(--flap-rotate));
      z-index: var(--flap-z);
    }

    .envelope::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 300px; 
      height: 180px; 
      z-index: 25;
      background: 
        linear-gradient(30deg, var(--base-dark) 47%, var(--shadow) 50%, var(--base) 50%) 150px 90px/ 150px 90px no-repeat,
        linear-gradient(31deg, var(--base) 49%, var(--shadow) 50%, transparent 50%) 0px 0px/ 152px 90px no-repeat,
        linear-gradient(150deg, var(--base) 50%, var(--shadow) 50%, var(--base-dark) 53%) 0px 90px/ 151px 90px no-repeat,
        linear-gradient(148.7deg, transparent 50%, var(--shadow) 50%, var(--base) 51%) 150px 0px/ 150px 90px no-repeat; 
    }
  </style>
</head>
<body>

  <audio id="bgm" src="motivation.mp3" loop></audio>

  <div class="container">
    <div class="content">
      <div class="envelope" onclick="handleOpen()"></div>
      <div class="letter">
        <div class="body">
          <span class="close" onclick="event.stopPropagation(); closeCard()">&times;</span>
          <div class="message">우리누나 <br>힘내세요!</div>
        </div>
      </div>
      <div class="shadow"></div>
    </div>
  </div> 

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    const audio = document.getElementById('bgm');
    let isAudioSet = false;

    // --- 애니메이션 타임라인 ---
    let t1 = gsap.timeline({ paused: true }); 
    t1.to('.envelope', { duration: 0.5, '--flap-rotate': '180deg' })
      .set('.envelope', { '--flap-z': 10 })
      .to('.letter', { y: -200, duration: 0.9, ease: "back.inOut(1.5)" })
      .set('.letter', { zIndex: 40 })
      .to('.letter', { duration: .7, ease: "back.out(.4)", y: -5, z: 250 });

    let t2 = gsap.timeline({ paused: true }); 
    t2.to('.shadow', {
      delay: 1.4,
      width: 450,
      boxShadow: "-75px 150px 10px 5px #eeeef3",
      ease: "back.out(.2)",
      duration: .7
    }); 

    function handleOpen() {
      // 1. 오디오 설정 (6초부터 재생)
      if (!isAudioSet) {
        audio.currentTime = 6; 
        audio.play().catch(e => console.log("상호작용 필요"));
        isAudioSet = true;

        // --- 추가된 부분: 편지를 열고 10초 뒤에 이동 ---
        setTimeout(() => {
          window.location.href = "last.html";
        }, 10000); // 10,000ms = 10초
      }
      
      // 2. 애니메이션 재생
      openCard();
    }

    function openCard() {
      t1.play();
      t2.play();
    }

    function closeCard() {
      t1.reverse();
      t2.reverse();
    }
  </script>
  

</body>
</html>
