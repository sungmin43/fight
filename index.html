<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Corgi & Heart Button - 10s Redirect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./confetti-button-with-pure-javascript/dist/style.css">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: #3f3456; overflow: hidden; 
        }

        .scene-container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative;
            transform: scale(1.5);
            transform-origin: center;
        }

        .dog {
            position: relative !important; top: 0 !important; left: 0 !important;
            transform: translate(0, 0) !important; margin: 0 auto; display: block;
            margin-bottom: 0 !important; 
        }

        .button-container { margin-top: 15px; z-index: 100; position: relative; }

        @media (max-width: 768px) { .scene-container { transform: scale(1.3); } }
        @media (max-width: 480px) { .scene-container { transform: scale(1.1); } }
    </style>
</head>
<body>
    <audio id="bgm" src="./motivation.mp3" autoplay muted loop playsinline></audio>

    <div class="scene-container">
        <div class="dog">
            <div class="heart heart--1"></div>
            <div class="heart heart--2"></div>
            <div class="heart heart--3"></div>
            <div class="heart heart--4"></div>
            <div class="head">
                <div class="year year--left"></div>
                <div class="year year--right"></div>
                <div class="nose"></div>
                <div class="face">
                    <div class="eye eye--left"></div>
                    <div class="eye eye--right"></div>
                    <div class="mouth"></div>
                </div>
            </div>
            <div class="body">
                <div class="cheast"></div>
                <div class="back"></div>
                <div class="legs">
                    <div class="legs__front legs__front--left"></div>
                    <div class="legs__front legs__front--right"></div>
                    <div class="legs__back legs__back--left"></div>
                    <div class="legs__back legs__back--right"></div>
                </div>
                <div class="tail"></div>
            </div>
        </div>

        <div class="button-container">
            <span class="pumping" data-text="fighting"></span>
        </div>
    </div>

    <script src="./confetti-button-with-pure-javascript/dist/script.js"></script>

    <script>
        const audio = document.getElementById('bgm');

        // 1. 소리 재생 처리 (상호작용 시 음소거 해제)
        const enableAudio = () => {
            audio.muted = false;
            audio.play();
            window.removeEventListener('click', enableAudio);
        };
        window.addEventListener('click', enableAudio);

        // 2. 10초 뒤에 temp.html로 이동
        setTimeout(() => {
            window.location.href = "temp.html";
        }, 8000); // 10000ms = 10초
    </script>
</body>
</html>
